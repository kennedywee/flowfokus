permissions:
  - slug: members:read
    name: Read members
  - slug: members:create
    name: Create members
  - slug: members:update
    name: Change member details
  - slug: members:link
    name: Give members a sign-in link code, and unlink them
  - slug: products:read
    name: Read offers
  - slug: products:create
    name: Create offers
  - slug: products:update
    name: Change offers and prices
  - slug: purchases:read
    name: Read sales
  - slug: purchases:create
    name: Create sales
  - slug: purchases:fulfill
    name: Deliver access
  - slug: purchases:fulfill_unpaid
    name: Deliver access before full payment
  - slug: payments:create
    name: Record payments
  - slug: purchases:refund
    name: Record refunds
  - slug: purchases:void
    name: Void sales
  - slug: memberships:revoke
    name: Revoke delivered access
  - slug: check_ins:read
    name: Read check-ins
  - slug: check_ins:create
    name: Check in members
  - slug: check_ins:override
    name: Let a member in despite a denial, with a reason
  - slug: programs:read
    name: Read programs, the schedule, and rosters
  - slug: programs:manage
    name: Create and change programs, times, and tickets
  - slug: bookings:create
    name: Book members into programs at the desk
  - slug: bookings:manage
    name: Cancel bookings and mark attendance
  - slug: settings:manage
    name: Manage organization settings and locations
  - slug: staff:manage
    name: Invite staff, change roles, and remove access
