# Fake identities for local development only. No email is sent.
# IDs match the Rails seeds and stay stable when the emulator restarts.
# Fake signing secret for Docker development. Never use it with live WorkOS.
webhookEndpoints:
  - endpoint_url: http://server:4000/webhooks/workos
    secret: whsec_flowfokus_local_only
    events:
      - user.created
      - user.updated
      - user.deleted
      - organization.created
      - organization.updated
      - organization.deleted
      - organization_membership.created
      - organization_membership.updated
      - organization_membership.deleted

users:
  - id: user_demo_chainsaw_owner
    email: demo.owner@flowfokus.test
    first_name: Demo
    last_name: Owner
    password: local-password
    email_verified: true
  - id: user_demo_chainsaw_receptionist
    email: receptionist@example.com
    first_name: Demo
    last_name: Receptionist
    password: local-password
    email_verified: true
  - id: user_demo_ironworks_owner
    email: ironworks.owner@example.com
    first_name: Ironworks
    last_name: Owner
    password: local-password
    email_verified: true
  - id: user_demo_multi_org
    email: manager@example.com
    first_name: Demo
    last_name: Manager
    password: local-password
    email_verified: true
  # A gym member, not staff. Links to a member record with a code from the desk.
  - id: user_demo_member
    email: member@example.com
    first_name: Mei
    last_name: Lim
    password: local-password
    email_verified: true

organizations:
  - id: org_demo_chainsaw
    name: Chainsaw Gym
    memberships:
      - email: demo.owner@flowfokus.test
        role: owner
        status: active
      - email: receptionist@example.com
        role: receptionist
        status: active
      - email: manager@example.com
        role: owner
        status: active
  - id: org_demo_ironworks
    name: Ironworks Fitness
    memberships:
      - email: ironworks.owner@example.com
        role: owner
        status: active
      - email: manager@example.com
        role: receptionist
        status: active
  - id: org_demo_hidden
    name: Hidden Gym
    memberships: []

roles:
  - slug: owner
    name: Owner
    permissions:
      - members:read
      - members:create
      - members:link
      - products:read
      - products:create
      - products:update
      - purchases:read
      - purchases:create
      - purchases:fulfill
      - purchases:fulfill_unpaid
      - payments:create
      - purchases:refund
      - purchases:void
      - memberships:revoke
      - check_ins:read
      - check_ins:create
      - settings:manage
      - staff:manage
  - slug: manager
    name: Manager
    permissions:
      - members:read
      - members:create
      - members:link
      - products:read
      - purchases:read
      - purchases:create
      - purchases:fulfill
      - payments:create
      - check_ins:read
      - check_ins:create
      - staff:manage
  - slug: receptionist
    name: Receptionist
    permissions:
      - members:read
      - products:read
      - purchases:read
      - check_ins:read
      - check_ins:create

permissions:
  - slug: members:read
    name: Read members
  - slug: members:create
    name: Create members
  - slug: members:link
    name: Give members a sign-in link code, and unlink them
  - slug: products:read
    name: Read offers
  - slug: products:create
    name: Create offers
  - slug: products:update
    name: Change offers and prices
  - slug: purchases:read
    name: Read sales
  - slug: purchases:create
    name: Create sales
  - slug: purchases:fulfill
    name: Deliver access
  - slug: purchases:fulfill_unpaid
    name: Deliver access before full payment
  - slug: payments:create
    name: Record payments
  - slug: purchases:refund
    name: Record refunds
  - slug: purchases:void
    name: Void sales
  - slug: memberships:revoke
    name: Revoke delivered access
  - slug: check_ins:read
    name: Read check-ins
  - slug: check_ins:create
    name: Check in members
  - slug: settings:manage
    name: Manage organization settings and locations
  - slug: staff:manage
    name: Invite staff, change roles, and remove access
