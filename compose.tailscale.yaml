# Opt-in access through this machine's Tailscale interface. Keep loopback ports.
services:
  portal:
    environment:
      FLOWFOKUS_TAILSCALE_IP: ${FLOWFOKUS_TAILSCALE_IP:?Set this machine's Tailscale IPv4 address}
    ports:
      - "${FLOWFOKUS_TAILSCALE_IP}:3001:3001"

  site:
    environment:
      SITE_BASE_DOMAINS: flowfokus.com,flowfokus.test
    ports:
      - "${FLOWFOKUS_TAILSCALE_IP}:3002:3002"
