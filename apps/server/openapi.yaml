          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/ProgramKind"
        location_id:
          type: string
          format: uuid
        capacity:
          type: integer
          minimum: 1
          description: Spots for each new time. One for an appointment slot.
        duration_minutes:
          type: integer
          minimum: 1
        host_name:
          type: string
          nullable: true
          description: The coach, instructor, or host shown to members.
        published:
          type: boolean
          description: Shown on the gym site schedule.
        created_at:
          type: string
          format: date-time

    ProgramListItem:
      allOf:
        - $ref: "#/components/schemas/Program"
        - type: object
          required: [upcoming_count]
          properties:
            upcoming_count:
              type: integer
              description: Times that have not ended and are not cancelled.

    ProgramSummary:
      type: object
      additionalProperties: false
      required: [id, name, kind, location_id, host_name, published]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/ProgramKind"
        location_id:
          type: string
          format: uuid
        host_name:
          type: string
          nullable: true
        published:
          type: boolean

    ProgramInput:
      type: object
      additionalProperties: false
      required: [name, kind, location_id, capacity, duration_minutes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        kind:
          $ref: "#/components/schemas/ProgramKind"
        location_id:
          type: string
          format: uuid
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 1440
        host_name:
          type: string
          nullable: true
          maxLength: 200
        published:
          type: boolean

    ProgramUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        location_id:
          type: string
          format: uuid
        capacity:
          type: integer
          minimum: 1
          maximum: 10000
        duration_minutes:
          type: integer
          minimum: 1
          maximum: 1440
        host_name:
          type: string
          nullable: true
          maxLength: 200
        published:
          type: boolean

    ProgramTicket:
      type: object
      additionalProperties: false
      required: [product_id, prices]
      properties:
        product_id:
          type: string
          format: uuid
        prices:
          type: array
          items:
            $ref: "#/components/schemas/Price"

    AcceptedOffer:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/ProductKind"

    ProgramDetail:
      allOf:
        - $ref: "#/components/schemas/Program"
        - type: object
          required: [location_name, occurrences, ticket, accepted_by]
          properties:
            location_name:
              type: string
            occurrences:
              type: array
              description: Times from the start of today, earliest first. Includes cancelled times.
              items:
                $ref: "#/components/schemas/Occurrence"
            ticket:
              allOf:
                - $ref: "#/components/schemas/ProgramTicket"
              nullable: true
              description: Null until staff add a ticket price.
            accepted_by:
              type: array
              description: Passes and memberships whose program rights cover this program.
              items:
                $ref: "#/components/schemas/AcceptedOffer"

    Occurrence:
      type: object
      additionalProperties: false
      required: [id, program_id, starts_at, ends_at, capacity, spots_taken, spots_left, bookable, cancelled_at, cancel_reason]
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        capacity:
          type: integer
        spots_taken:
          type: integer
          description: Confirmed bookings and holds that have not ended.
        spots_left:
          type: integer
        bookable:
          type: boolean
          description: Not cancelled, not started, and not full.
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        cancel_reason:
          type: string
          nullable: true

    ScheduleEntry:
      allOf:
        - $ref: "#/components/schemas/Occurrence"
        - type: object
          required: [program]
          properties:
            program:
              $ref: "#/components/schemas/ProgramSummary"

    ScheduleInput:
      type: object
      additionalProperties: false
      required: [date, time]
      properties:
        date:
          type: string
          format: date
          description: The first day, in the gym's time zone.
        time:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Start time, HH:MM, in the gym's time zone.
        weeks:
          type: integer
          minimum: 1
          maximum: 26
          default: 1
          description: Repeat the same day and time for this many weeks.

    TicketInput:
      type: object
      additionalProperties: false
      required: [label, amount_minor]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        amount_minor:
          type: integer
          minimum: 0

    BookingStatus:
      type: string
      description: |
        - `held`: an online checkout holds the spot until `held_until`.
        - `confirmed`: the spot is taken and a use is recorded.
        - `attended`: staff marked the member present.
        - `cancelled`: the spot is free again.
        - `expired`: the checkout ended without payment.
      enum: [held, confirmed, attended, cancelled, expired]

    BookingSource:
      type: string
      description: "`entitlement`: booked with a pass or membership. `ticket`: bought for this time."
      enum: [entitlement, ticket]

    BookingProgram:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/ProgramKind"

    BookingRight:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    BookingBase:
      type: object
      required:
        - id
        - status
        - occurrence_id
        - program
        - starts_at
        - ends_at
        - entitlement
        - source
        - sale_id
        - held_until
        - confirmed_at
        - cancelled_at
        - cancel_reason
        - attended_at
        - use_returned
        - attendee_name
        - guest_name
        - checkout_id
      properties:
        attendee_name:
          type: string
          description: The member or guest who takes the spot.
        guest_name:
          type: string
          nullable: true
          description: Set when the attendee is a guest, not a member.
        checkout_id:
          type: string
          format: uuid
          nullable: true
          description: The online checkout that holds or bought this spot.
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/BookingStatus"
        occurrence_id:
          type: string
          format: uuid
        program:
          $ref: "#/components/schemas/BookingProgram"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        entitlement:
          allOf:
            - $ref: "#/components/schemas/BookingRight"
          nullable: true
          description: The right this booking used. Null while a checkout holds the spot.
        source:
          $ref: "#/components/schemas/BookingSource"
        sale_id:
          type: string
          format: uuid
          nullable: true
          description: The ticket sale behind this booking.
        held_until:
          type: string
          format: date-time
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
        cancel_reason:
          type: string
          nullable: true
        attended_at:
          type: string
          format: date-time
          nullable: true
        use_returned:
          type: boolean
          description: True when cancelling gave the use back.

    Booking:
      allOf:
        - $ref: "#/components/schemas/BookingBase"
