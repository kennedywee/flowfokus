          required: [member, holder, guest_email]
          properties:
            member:
              allOf:
                - $ref: "#/components/schemas/MemberSummary"
              nullable: true
              description: The attendee, when a member. Null for a guest.
            holder:
              $ref: "#/components/schemas/MemberSummary"
            guest_email:
              type: string
              nullable: true

    MemberBooking:
      allOf:
        - $ref: "#/components/schemas/BookingBase"
        - type: object
          required: [location_name, cancellable, for_someone_else]
          properties:
            for_someone_else:
              type: boolean
              description: True when the member booked this spot for another person, or another person booked it for them.
            location_name:
              type: string
            cancellable:
              type: boolean
              description: True when the member can cancel it now.

    Roster:
      allOf:
        - $ref: "#/components/schemas/Occurrence"
        - type: object
          required: [program, bookings]
          properties:
            program:
              allOf:
                - $ref: "#/components/schemas/Program"
                - type: object
                  required: [location_name]
                  properties:
                    location_name:
                      type: string
            bookings:
              type: array
              description: Every booking, including cancelled ones, oldest first.
              items:
                $ref: "#/components/schemas/Booking"

    StaffBookingOptions:
      type: object
      additionalProperties: false
      required: [occurrence, member, rights, ticket_prices, booking]
      properties:
        occurrence:
          $ref: "#/components/schemas/Occurrence"
        member:
          $ref: "#/components/schemas/MemberSummary"
        rights:
          type: array
          description: The member's rights that can book this time now.
          items:
            $ref: "#/components/schemas/Entitlement"
        ticket_prices:
          type: array
          description: Ticket prices on sale for this program.
          items:
            $ref: "#/components/schemas/Price"
        booking:
          allOf:
            - $ref: "#/components/schemas/MemberBooking"
          nullable: true
          description: The member's live booking for this time, if any.

    StaffBookingInput:
      type: object
      additionalProperties: false
      required: [occurrence_id, member_id, entitlement_id]
      properties:
        occurrence_id:
          type: string
          format: uuid
        member_id:
          type: string
          format: uuid
        entitlement_id:
          type: string
          format: uuid

    BookingCancelInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
        return_use:
          type: boolean
          default: true
          description: Give the use back to the member's pass or membership.

    MemberBookingInput:
      type: object
      additionalProperties: false
      required: [occurrence_id, entitlement_id]
      properties:
        occurrence_id:
          type: string
          format: uuid
        entitlement_id:
          type: string
          format: uuid

    PublicProgram:
      type: object
      additionalProperties: false
      required: [id, name, description, kind, location_name, duration_minutes, host_name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        kind:
          $ref: "#/components/schemas/ProgramKind"
        location_name:
          type: string
        duration_minutes:
          type: integer
        host_name:
          type: string
          nullable: true

    PublicScheduleProgram:
      allOf:
        - $ref: "#/components/schemas/PublicProgram"
        - type: object
          required: [ticket_prices, accepted_by]
          properties:
            ticket_prices:
              type: array
              items:
                $ref: "#/components/schemas/PublicPrice"
            accepted_by:
              type: array
              description: Names of passes and memberships on sale that cover this program.
              items:
                type: string

    PublicOccurrence:
      type: object
      additionalProperties: false
      required: [id, program_id, starts_at, ends_at, capacity, spots_left, bookable, cancelled]
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        capacity:
          type: integer
        spots_left:
          type: integer
        bookable:
          type: boolean
        cancelled:
          type: boolean

    PublicSchedule:
      type: object
      additionalProperties: false
      required: [programs, occurrences]
      properties:
        programs:
          type: array
          items:
            $ref: "#/components/schemas/PublicScheduleProgram"
        occurrences:
          type: array
          description: Earliest first.
          items:
            $ref: "#/components/schemas/PublicOccurrence"

    MemberBookingOptions:
      type: object
      additionalProperties: false
      required: [occurrence, program, rights, ticket_prices, booking]
      properties:
        occurrence:
          $ref: "#/components/schemas/PublicOccurrence"
        program:
          $ref: "#/components/schemas/PublicProgram"
        rights:
          type: array
          description: The member's passes and memberships that can book this time now.
          items:
            $ref: "#/components/schemas/Entitlement"
        ticket_prices:
          type: array
          items:
            $ref: "#/components/schemas/Price"
        booking:
          allOf:
            - $ref: "#/components/schemas/MemberBooking"
          nullable: true
          description: The member's live booking for this time, if any.

    CheckoutInput:
      type: object
      additionalProperties: false
      required: [price_id]
      properties:
        price_id:
          type: string
          format: uuid
        occurrence_id:
          type: string
          format: uuid
          description: Required for a ticket, and only for a ticket.
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: Spots to buy. Above 1 for a ticket only.
        attendees:
          type: array
          maxItems: 10
          description: Who comes to each spot. Omit for one spot for the member.
          items:
            $ref: "#/components/schemas/MemberAttendeeInput"

    CheckoutAttendee:
      type: object
      additionalProperties: false
      required: [name, guest]
      properties:
        name:
          type: string
        guest:
          type: boolean

    CheckoutStatus:
      type: string
      description: "`expired` means the checkout ended unpaid and its held spot is free."
      enum: [open, paid, cancelled, expired]

    Checkout:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - provider
        - payment_url
        - amount_minor
        - currency
        - expires_at
        - completed_at
        - product_name
        - product_kind
        - price_label
        - occurrence
        - sale_id
        - booking_id
        - quantity
        - attendees
      properties:
        quantity:
          type: integer
        attendees:
          type: array
          items:
            $ref: "#/components/schemas/CheckoutAttendee"
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/CheckoutStatus"
        provider:
          type: string
          description: "`test` for the local test provider. `free` when nothing was due."
        payment_url:
          type: string
          nullable: true
          description: Where the provider takes payment. Null for the test provider, whose page the gym site shows.
        amount_minor:
          type: integer
          description: The total for every spot.
        currency:
          type: string
        expires_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        product_name:
          type: string
        product_kind:
          $ref: "#/components/schemas/ProductKind"
        price_label:
          type: string
        occurrence:
          allOf:
            - $ref: "#/components/schemas/CheckoutOccurrence"
          nullable: true
        sale_id:
          type: string
          format: uuid
          nullable: true
          description: Set when paid.
        booking_id:
          type: string
          format: uuid
          nullable: true

    CheckoutOccurrence:
      type: object
      additionalProperties: false
      required: [id, program_name, starts_at, ends_at]
      properties:
        id:
          type: string
          format: uuid
        program_name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    ProgramListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProgramListItem"

    ProgramDetailResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ProgramDetail"

    ScheduleEntryListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleEntry"

    RosterResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Roster"

    StaffBookingOptionsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/StaffBookingOptions"

    MemberBookingOptionsResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MemberBookingOptions"

    MemberBookingResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MemberBooking"

    MemberBookingListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/MemberBooking"

    CheckoutResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Checkout"

    PublicScheduleResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PublicSchedule"
