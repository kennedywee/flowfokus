openapi: 3.0.3
info:
  title: Flowfokus API
  version: 0.1.0
  description: |
    Rails API for Flowfokus. Web apps call it from server code only.

    - Success bodies use `{ "data": ... }`.
    - Error bodies use `{ "error": { "code", "message", "details"? } }`.
    - Organization-scoped paths need the `Flowfokus-Organization` header with the gym slug
      (the `organizationHeader` scheme).
    - `/staff/*` paths need `Authorization: Bearer <token>`: a WorkOS AuthKit access token,
      verified against the configured JWKS (RS256, issuer, expiry, client). The local demo
      token also works, but only when `FLOWFOKUS_DEMO_MODE=true` in development or test.
    - Money uses integer minor units with an ISO 4217 currency code.
    - Times are UTC ISO 8601 strings.
    - Portal and site Workers send `Flowfokus-Worker-Secret` and `Flowfokus-Client-IP`.
      Rails trusts the client IP only with a valid secret. Otherwise it uses the
      connection IP. The secret never replaces the Bearer token.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: health
  - name: public
  - name: staff
  - name: member
  - name: webhooks

paths:
  /up:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness check. Does not touch the database.
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness check. Runs a database query.
      responses:
        "200":
          description: The database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /public/organization:
    get:
      tags: [public]
      operationId: getPublicOrganization
      security:
        - organizationHeader: []
      summary: Published details of the gym named by the slug header.
      responses:
        "200":
          description: The gym.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PublicOrganization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /public/products:
    get:
      tags: [public]
      operationId: listPublicProducts
      security:
        - organizationHeader: []
      summary: Published products and their available prices.
      responses:
        "200":
          description: Offers on sale.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /public/schedule:
    get:
      tags: [public]
      operationId: getPublicSchedule
      summary: Published programs and their times for the next days.
      description: |
        Times start today in the gym's time zone. Cancelled times stay listed with `cancelled: true`.
      security:
        - organizationHeader: []
      parameters:
        - name: days
          in: query
          required: false
          description: How many days to include, from today.
          schema:
            type: integer
            minimum: 1
            maximum: 31
            default: 14
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicScheduleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/organization:
    get:
      tags: [staff]
      operationId: getStaffOrganization
      summary: The current organization, its locations, and the actor's permissions.
      security:
        - bearerAuth: []
          organizationHeader: []
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/StaffOrganization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [staff]
      operationId: updateStaffOrganization
      summary: Change the time zone or gym site publication. Needs settings:manage.
      description: |
        The name comes from WorkOS and cannot change here. The currency is fixed, because
        prices and sales are recorded in it. Unpublishing hides the gym site and its offers.
      security:
        - bearerAuth: []
          organizationHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/locations:
    post:
      tags: [staff]
      operationId: createStaffLocation
      summary: Add a location. Needs settings:manage.
      security:
        - bearerAuth: []
          organizationHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/locations/{id}:
    patch:
      tags: [staff]
      operationId: updateStaffLocation
      summary: Rename a location or change its address. Needs settings:manage.
      description: |
        Locations keep their history, so they cannot be deleted.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/team:
    get:
      tags: [staff]
      operationId: getStaffTeam
      summary: Staff members, pending invitations, and roles. Needs staff:manage.
      description: |
        Members come from the synced copy. Roles and invitations come from WorkOS now.
        `grantable` marks roles whose permissions the actor holds. `manageable` marks
        members the actor may change.
      security:
        - bearerAuth: []
          organizationHeader: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/team/invitations:
    post:
      tags: [staff]
      operationId: createStaffInvitation
      summary: Invite someone to join the staff. Needs staff:manage.
      description: |
        WorkOS sends the invitation. A role with permissions the actor lacks returns
        422 `staff_change_refused`. WorkOS can refuse too: 422 `workos_rejected`.
        Returns the whole team.
      security:
        - bearerAuth: []
          organizationHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/team/invitations/{invitation_id}/revoke:
    post:
      tags: [staff]
      operationId: revokeStaffInvitation
      summary: Revoke a pending invitation. Needs staff:manage.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/InvitationIdPath"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/team/members/{id}:
    patch:
      tags: [staff]
      operationId: updateStaffTeamMember
      summary: Change a staff member's role. Needs staff:manage.
      description: |
        Refused with 422 `staff_change_refused` when the actor changes themselves, grants
        or removes permissions they lack, or leaves nobody with staff:manage. The new role
        reaches the member's token at their next session refresh. Returns the whole team.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [staff]
      operationId: removeStaffTeamMember
      summary: Remove a member's staff access. Needs staff:manage.
      description: |
        Deletes the WorkOS membership. The local copy stays as history. The same rules as
        a role change apply. Their current token works until it expires. Returns the whole team.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/memberships:
    get:
      tags: [staff]
      operationId: listStaffMemberships
      summary: The organizations the signed-in staff user can open.
      description: |
        Needs a Bearer token but no `Flowfokus-Organization` header. The list comes from the
        synced copy of WorkOS memberships and only helps navigation. Opening an organization
        still needs a token issued for that organization. Removed memberships and gyms
        deleted in WorkOS are not listed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active memberships, ordered by organization name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffMembership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/overview:
    get:
      tags: [staff]
      operationId: getStaffOverview
      summary: Figures for the staff Home screen.
      security:
        - bearerAuth: []
          organizationHeader: []
      responses:
        "200":
          description: Dashboard counts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/StaffOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/members:
    get:
      tags: [staff]
      operationId: listStaffMembers
      summary: Members of the organization, newest first. Needs members:read.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive match on name or email.
          schema:
            type: string
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [staff]
      operationId: createStaffMember
      summary: Create a member without a login. Needs members:create.
      security:
        - bearerAuth: []
          organizationHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/members/{id}:
    get:
      tags: [staff]
      operationId: getStaffMember
      summary: One member with membership periods and current rights. Needs members:read.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MemberDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/members/{id}/renewals:
    post:
      tags: [staff]
      operationId: renewStaffMembership
      summary: Sell another period at the member's agreed terms. Needs purchases:create.
      description: |
        Copies the price, amount, and terms of the line item behind the member's latest
        delivered period. It never uses the current catalog price, so it works after that
        price is archived. Pay and deliver the sale as usual. Delivery appends the new
        period after the last one. A member without a delivered membership gets 422
        `renewal_unavailable`.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewalInput"
      responses:
        "200":
          description: Replay of an earlier request with the same key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/members/{id}/link:
    post:
      tags: [staff]
      operationId: createStaffMemberLinkCode
      summary: Create a one-time code that links this member to a sign-in. Needs members:link.
      description: |
        The plain code is returned once. Give it to the member. A new code replaces any
        open code for the member. A linked member returns 422 `member_already_linked`.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberLinkCodeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [staff]
      operationId: unlinkStaffMember
      summary: Remove the member's link to a sign-in. Needs members:link.
      description: |
        The member record and its history stay. Open codes expire.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/products:
    get:
      tags: [staff]
      operationId: listStaffProducts
      summary: All products with benefits and prices, including archived prices. Needs products:read.
      security:
        - bearerAuth: []
          organizationHeader: []
      responses:
        "200":
          description: Products.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [staff]
      operationId: createStaffProduct
      summary: Create a membership product with its benefits. Needs products:create.
      description: |
        A product needs at least one benefit. Add prices separately.
      security:
        - bearerAuth: []
          organizationHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/products/{id}:
    patch:
      tags: [staff]
      operationId: updateStaffProduct
      summary: Change a product. Needs products:update.
      description: |
        Changes the name, description, or publication. `benefits`, when sent, replaces
        every benefit template. Past sales keep their snapshotted terms.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/products/{id}/prices:
    post:
      tags: [staff]
      operationId: createStaffPrice
      summary: Add a price to a product. Needs products:update.
      description: |
        Amount, currency, and duration never change after creation. The currency is the
        organization currency. Returns the whole product.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
