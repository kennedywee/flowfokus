      summary: Pay with the local test provider. Development and test only.
      description: |
        Moves no money. Returns 404 unless `FLOWFOKUS_TEST_PAYMENTS=true` and the checkout uses the test provider.
        Creates the sale, records an online payment, delivers the purchase, and confirms the held spot.
        An expired or cancelled checkout returns 422 `checkout_closed`.
      security:
