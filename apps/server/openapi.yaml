        payment_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
        currency:
          type: string
        reason:
          type: string
        refunded_at:
          type: string
          format: date-time

    OrganizationUpdate:
      type: object
      additionalProperties: false
      properties:
        timezone:
          type: string
          description: IANA time zone, for example `Asia/Kuala_Lumpur`.
