openapi: 3.0.3
info:
  title: Flowfokus API
  version: 0.1.0
  description: |
    Rails API for Flowfokus. Web apps call it from server code only.

    - Success bodies use `{ "data": ... }`.
    - Error bodies use `{ "error": { "code", "message", "details"? } }`.
    - Organization-scoped paths need the `Flowfokus-Organization` header with the gym slug
      (the `organizationHeader` scheme).
    - `/staff/*` paths need `Authorization: Bearer <token>`: a WorkOS AuthKit access token,
      verified against the configured JWKS (RS256, issuer, expiry, client). The local demo
      token also works, but only when `FLOWFOKUS_DEMO_MODE=true` in development or test.
    - Money uses integer minor units with an ISO 4217 currency code.
    - Times are UTC ISO 8601 strings.
    - Portal and site Workers send `Flowfokus-Worker-Secret` and `Flowfokus-Client-IP`.
      Rails trusts the client IP only with a valid secret. Otherwise it uses the
      connection IP. The secret never replaces the Bearer token.
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: health
  - name: public
  - name: staff
  - name: member
  - name: webhooks

paths:
  /up:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness check. Does not touch the database.
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness check. Runs a database query.
      responses:
        "200":
          description: The database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /public/organization:
    get:
      tags: [public]
      operationId: getPublicOrganization
      security:
        - organizationHeader: []
      summary: Published details of the gym named by the slug header.
      responses:
        "200":
          description: The gym.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PublicOrganization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /public/products:
    get:
      tags: [public]
      operationId: listPublicProducts
      security:
        - organizationHeader: []
      summary: Published products and their available prices.
      responses:
        "200":
          description: Offers on sale.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /staff/organization:
    get:
      tags: [staff]
      operationId: getStaffOrganization
      summary: The current organization, its locations, and the actor's permissions.
      security:
        - bearerAuth: []
          organizationHeader: []
      responses:
        "200":
          description: The organization.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/StaffOrganization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [staff]
      operationId: updateStaffOrganization
      summary: Change the time zone or gym site publication. Needs settings:manage.
      description: |
        The name comes from WorkOS and cannot change here. The currency is fixed, because
        prices and sales are recorded in it. Unpublishing hides the gym site and its offers.
      security:
        - bearerAuth: []
          organizationHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOrganizationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/locations:
    post:
      tags: [staff]
      operationId: createStaffLocation
      summary: Add a location. Needs settings:manage.
      security:
        - bearerAuth: []
          organizationHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/locations/{id}:
    patch:
      tags: [staff]
      operationId: updateStaffLocation
      summary: Rename a location or change its address. Needs settings:manage.
      description: |
        Locations keep their history, so they cannot be deleted.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/team:
    get:
      tags: [staff]
      operationId: getStaffTeam
      summary: Staff members, pending invitations, and roles. Needs staff:manage.
      description: |
        Members come from the synced copy. Roles and invitations come from WorkOS now.
        `grantable` marks roles whose permissions the actor holds. `manageable` marks
        members the actor may change.
      security:
        - bearerAuth: []
          organizationHeader: []
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/team/invitations:
    post:
      tags: [staff]
      operationId: createStaffInvitation
      summary: Invite someone to join the staff. Needs staff:manage.
      description: |
        WorkOS sends the invitation. A role with permissions the actor lacks returns
        422 `staff_change_refused`. WorkOS can refuse too: 422 `workos_rejected`.
        Returns the whole team.
      security:
        - bearerAuth: []
          organizationHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/team/invitations/{invitation_id}/revoke:
    post:
      tags: [staff]
      operationId: revokeStaffInvitation
      summary: Revoke a pending invitation. Needs staff:manage.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/InvitationIdPath"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/team/members/{id}:
    patch:
      tags: [staff]
      operationId: updateStaffTeamMember
      summary: Change a staff member's role. Needs staff:manage.
      description: |
        Refused with 422 `staff_change_refused` when the actor changes themselves, grants
        or removes permissions they lack, or leaves nobody with staff:manage. The new role
        reaches the member's token at their next session refresh. Returns the whole team.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [staff]
      operationId: removeStaffTeamMember
      summary: Remove a member's staff access. Needs staff:manage.
      description: |
        Deletes the WorkOS membership. The local copy stays as history. The same rules as
        a role change apply. Their current token works until it expires. Returns the whole team.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/memberships:
    get:
      tags: [staff]
      operationId: listStaffMemberships
      summary: The organizations the signed-in staff user can open.
      description: |
        Needs a Bearer token but no `Flowfokus-Organization` header. The list comes from the
        synced copy of WorkOS memberships and only helps navigation. Opening an organization
        still needs a token issued for that organization. Removed memberships and gyms
        deleted in WorkOS are not listed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Active memberships, ordered by organization name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffMembership"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/overview:
    get:
      tags: [staff]
      operationId: getStaffOverview
      summary: Counts for the staff dashboard.
      security:
        - bearerAuth: []
          organizationHeader: []
      responses:
        "200":
          description: Dashboard counts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/StaffOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/members:
    get:
      tags: [staff]
      operationId: listStaffMembers
      summary: Members of the organization, newest first. Needs members:read.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive match on name or email.
          schema:
            type: string
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [staff]
      operationId: createStaffMember
      summary: Create a member without a login. Needs members:create.
      security:
        - bearerAuth: []
          organizationHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/members/{id}:
    get:
      tags: [staff]
      operationId: getStaffMember
      summary: One member with membership periods and current rights. Needs members:read.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/MemberDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/members/{id}/renewals:
    post:
      tags: [staff]
      operationId: renewStaffMembership
      summary: Sell another period at the member's agreed terms. Needs purchases:create.
      description: |
        Copies the price, amount, and terms of the line item behind the member's latest
        delivered period. It never uses the current catalog price, so it works after that
        price is archived. Pay and deliver the sale as usual. Delivery appends the new
        period after the last one. A member without a delivered membership gets 422
        `renewal_unavailable`.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenewalInput"
      responses:
        "200":
          description: Replay of an earlier request with the same key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/products:
    get:
      tags: [staff]
      operationId: listStaffProducts
      summary: All products with benefits and prices, including archived prices. Needs products:read.
      security:
        - bearerAuth: []
          organizationHeader: []
      responses:
        "200":
          description: Products.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StaffProduct"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [staff]
      operationId: createStaffProduct
      summary: Create a membership product with its benefits. Needs products:create.
      description: |
        A product needs at least one benefit. Add prices separately.
      security:
        - bearerAuth: []
          organizationHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/products/{id}:
    patch:
      tags: [staff]
      operationId: updateStaffProduct
      summary: Change a product. Needs products:update.
      description: |
        Changes the name, description, or publication. `benefits`, when sent, replaces
        every benefit template. Past sales keep their snapshotted terms.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/products/{id}/prices:
    post:
      tags: [staff]
      operationId: createStaffPrice
      summary: Add a price to a product. Needs products:update.
      description: |
        Amount, currency, and duration never change after creation. The currency is the
        organization currency. Returns the whole product.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/prices/{id}:
    patch:
      tags: [staff]
      operationId: updateStaffPrice
      summary: Change a price label or sale status. Needs products:update.
      description: |
        Only `label` and `available` can change. An archived price stays off sale.
        Returns the whole product.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceUpdate"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/prices/{id}/archive:
    post:
      tags: [staff]
      operationId: archiveStaffPrice
      summary: Archive a price. Needs products:update.
      description: |
        Stops new sales for good. Past sales keep the price. Repeating the call changes nothing.
        Returns the whole product.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/sales:
    get:
      tags: [staff]
      operationId: listStaffSales
      summary: Sales, newest first. Needs purchases:read.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - name: member_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Sales.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [staff]
      operationId: createStaffSale
      summary: Record a membership sale with one line, quantity one. Needs purchases:create.
      description: |
        The line snapshots the product name, price, and benefit terms.
        A retry with the same Idempotency-Key and body returns the first sale with status 200.
        The same key with a different body returns 409.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleInput"
      responses:
        "200":
          description: Replay of an earlier request with the same key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/sales/{id}:
    get:
      tags: [staff]
      operationId: getStaffSale
      summary: One sale. Needs purchases:read.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: The sale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/sales/{id}/payments:
    post:
      tags: [staff]
      operationId: createStaffSalePayment
      summary: Record a manual cash or bank-transfer payment. Needs payments:create.
      description: |
        Partial payments are allowed. A payment above the balance returns 422 `overpayment`.
        Flowfokus does not move money; this records money received by staff.
        Returns the updated sale.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: Replay of an earlier request with the same key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "201":
          description: Payment recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/sales/{id}/refunds:
    post:
      tags: [staff]
      operationId: createStaffRefund
      summary: Record money returned against one payment. Needs purchases:refund.
      description: |
        Refunds never edit the payment. The total refunded on a payment cannot exceed it:
        422 `refund_exceeds_payment`. A refund keeps the member's access. Revoke access
        separately. Flowfokus does not move money. Returns the updated sale.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundInput"
      responses:
        "200":
          description: Replay of an earlier request with the same key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "201":
          description: Refund recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/sales/{id}/void:
    post:
      tags: [staff]
      operationId: voidStaffSale
      summary: Cancel a sale that delivered nothing and kept no money. Needs purchases:void.
      description: |
        A delivered sale, or one that still keeps money, returns 422 `sale_not_voidable`.
        A void sale takes no payments and cannot be delivered (422 `sale_voided`). Repeating
        the call changes nothing. Returns the updated sale.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/sales/{id}/revoke:
    post:
      tags: [staff]
      operationId: revokeStaffSale
      summary: End the access delivered by this sale. Needs memberships:revoke.
      description: |
        Revokes this delivery's membership period and entitlements now. Other periods,
        payments, and recorded usage stay. A revoked period no longer blocks new periods
        over the same dates. An undelivered sale returns 422 `sale_not_delivered`.
        Repeating the call changes nothing. Returns the updated sale.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonInput"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/sales/{id}/fulfill:
    post:
      tags: [staff]
      operationId: fulfillStaffSale
      summary: Deliver a fully paid sale. Needs purchases:fulfill.
      description: |
        Creates the membership (or adds a period to the existing one), the benefit grant,
        and entitlements in one transaction. A repeat call returns the existing
        fulfillment with status 200 and creates nothing. An unpaid balance returns 422 `sale_not_paid`,
        unless the body has an `early_reason` and the actor has purchases:fulfill_unpaid.
        Early delivery keeps the balance due and records the reason and the unpaid amount.
        Returns the updated sale.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FulfillInput"
      responses:
        "200":
          description: Already fulfilled. Nothing changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "201":
          description: Fulfilled now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /staff/check_ins:
    get:
      tags: [staff]
      operationId: listStaffCheckIns
      summary: Recent check-ins, newest first, at most 100. Needs check_ins:read.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - name: member_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Check-ins.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CheckIn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [staff]
      operationId: createStaffCheckIn
      summary: Check a member in at a location. Needs check_ins:create.
      description: |
        Returns 201 for both granted and denied attempts. Read `result`.
        A denied attempt records `denial_reason` and consumes nothing.
        A retry with the same Idempotency-Key and body returns the first check-in with
        status 200 and never consumes twice. The same key with a different body returns 409.
      security:
        - bearerAuth: []
          organizationHeader: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInInput"
      responses:
        "200":
          description: Replay of an earlier request with the same key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResponse"
        "201":
          description: Check-in recorded (granted or denied).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckInResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /member/profile:
    get:
      tags: [member]
      operationId: getMemberProfile
      summary: The signed-in member. Not available until WorkOS verification ships.
      description: |
        Always fails closed in Sprint 1. No token gives 401. The demo token gives 403
        because demo actors are staff only. Any other token gives 503 or 401.
      security:
        - bearerAuth: []
          organizationHeader: []
      responses:
        "200":
          description: The member.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /webhooks/workos:
    post:
      tags: [webhooks]
      operationId: receiveWorkosWebhook
      summary: Receives a signed WorkOS event.
      description: |
        Called by WorkOS only. No Bearer token and no `Flowfokus-Organization` header.
        Rails checks the `WorkOS-Signature` header against the raw body before it reads
        any JSON: HMAC-SHA256 with `WORKOS_WEBHOOK_SECRET` over `<t>.<raw body>`, and
        `t` (milliseconds) within 3 minutes of the server clock.

        A verified event is saved to the event ledger before processing, then
        processed in the background. A redelivered event answers 200 with
        `duplicate: true` and changes nothing. Unsupported event types are saved
        and ignored. Production answers 503 until `WORKOS_VERIFIED=true`.
      security: []
      parameters:
        - name: WorkOS-Signature
          in: header
          required: true
          description: "`t=<milliseconds since epoch>, v1=<hex HMAC-SHA256>`"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkosWebhookEvent"
      responses:
        "200":
          description: The event is saved. Processing happens later.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/WorkosWebhookReceipt"
        "400":
          description: "`invalid_signature` for a missing, malformed, mismatched, or expired signature. `bad_request` for a signed body that is not a WorkOS event."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkosWebhookErrorResponse"
        "413":
          description: "`payload_too_large`: the body is larger than 1 MB."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkosWebhookErrorResponse"
        "500":
          description: "`internal_error`: an unexpected server failure. WorkOS retries the delivery."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkosWebhookErrorResponse"
        "503":
          description: "`webhook_not_configured`: no webhook secret, or WorkOS is not verified in production. `database_unavailable`: the ledger cannot be reached."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkosWebhookErrorResponse"

components:
  securitySchemes:
    organizationHeader:
      type: apiKey
      in: header
      name: Flowfokus-Organization
      description: |
        Gym slug, for example `chainsaw`. Required on every `/public/*`, `/staff/*`, and
        `/member/*` call. It selects the organization; it never grants access by itself.
        Modeled as a scheme so the shared client can set it once.
    bearerAuth:
      type: http
      scheme: bearer
      description: WorkOS AuthKit access token, or the local demo token (development and test only).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per logical request. 8 to 255 printable ASCII characters. A UUID works well.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    InvitationIdPath:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^invitation_[A-Za-z0-9]{1,100}$"
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Missing header or malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid Bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The actor lacks access to this organization or permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Unknown organization or record.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Idempotency-Key reused with a different request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: "`rate_limited`: too many requests from this client IP. Try again later."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Validation or business rule failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Authentication is not configured, or a dependency is down.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              enum: [ok]

    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code.
        - `bad_request` (400), `organization_required` (400), `idempotency_key_required` (400)
        - `unauthenticated` (401), `invalid_token` (401)
        - `forbidden` (403), `organization_mismatch` (403)
        - `not_found` (404)
        - `idempotency_key_reused` (409)
        - `validation_failed`, `price_unavailable`, `renewal_unavailable`, `overpayment`, `sale_not_paid`,
          `sale_voided`, `sale_not_voidable`, `sale_not_delivered`, `refund_exceeds_payment`,
          `staff_change_refused`, `workos_rejected` (422)
        - `rate_limited` (429)
        - `internal_error` (500)
        - `auth_not_configured`, `auth_unavailable`, `database_unavailable`, `workos_unavailable` (503)
      enum:
        - bad_request
        - organization_required
        - idempotency_key_required
        - unauthenticated
        - invalid_token
        - forbidden
        - organization_mismatch
        - not_found
        - idempotency_key_reused
        - validation_failed
        - price_unavailable
        - renewal_unavailable
        - overpayment
        - sale_not_paid
        - sale_voided
        - sale_not_voidable
        - sale_not_delivered
        - refund_exceeds_payment
        - staff_change_refused
        - workos_rejected
        - rate_limited
        - internal_error
        - auth_not_configured
        - auth_unavailable
        - database_unavailable
        - workos_unavailable

    WorkosWebhookEvent:
      type: object
      description: A WorkOS event, as WorkOS sends it. Other fields are allowed and kept.
      required: [id, event, data, created_at]
      properties:
        id:
          type: string
          description: WorkOS event ID. Unique; redeliveries repeat it.
        event:
          type: string
          example: organization_membership.updated
        data:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
      additionalProperties: true

    WorkosWebhookReceipt:
      type: object
      additionalProperties: false
      required: [id, event, status, duplicate]
      properties:
        id:
          type: string
          description: The WorkOS event ID.
        event:
          type: string
        status:
          type: string
          enum: [pending, processed, ignored, failed]
          description: Ledger status. A new event is usually `pending`.
        duplicate:
          type: boolean
          description: True when the ledger already had this event.

    WorkosWebhookErrorCode:
      type: string
      description: |
        Error codes of `POST /webhooks/workos` only. Separate from `ErrorCode`,
        so the webhook codes do not widen the responses of other endpoints.
        - `bad_request`, `invalid_signature` (400)
        - `payload_too_large` (413)
        - `internal_error` (500)
        - `webhook_not_configured`, `database_unavailable` (503)
      enum:
        - bad_request
        - invalid_signature
        - payload_too_large
        - internal_error
        - webhook_not_configured
        - database_unavailable

    WorkosWebhookErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/WorkosWebhookErrorCode"
            message:
              type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            details:
              type: object
              description: For `validation_failed`, maps a field name to a list of messages.
              additionalProperties:
                type: array
                items:
                  type: string

    PublicOrganization:
      type: object
      additionalProperties: false
      required: [slug, name, timezone, currency, locations]
      properties:
        slug:
          type: string
        name:
          type: string
        timezone:
          type: string
          description: IANA time zone, for example `Asia/Kuala_Lumpur`.
        currency:
          type: string
          description: ISO 4217 code.
        locations:
          type: array
          items:
            $ref: "#/components/schemas/PublicLocation"

    PublicLocation:
      type: object
      additionalProperties: false
      required: [name, address]
      properties:
        name:
          type: string
        address:
          type: string
          nullable: true

    Location:
      type: object
      additionalProperties: false
      required: [id, name, address]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
          nullable: true

    Permission:
      type: string
      enum:
        - members:read
        - members:create
        - products:read
        - products:create
        - products:update
        - purchases:read
        - purchases:create
        - purchases:fulfill
        - purchases:fulfill_unpaid
        - payments:create
        - purchases:refund
        - purchases:void
        - memberships:revoke
        - check_ins:read
        - check_ins:create
        - settings:manage
        - staff:manage

    StaffOrganization:
      type: object
      additionalProperties: false
      required: [id, slug, name, timezone, currency, published, locations, actor]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        timezone:
          type: string
        currency:
          type: string
        published:
          type: boolean
          description: True when the gym site is public.
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        actor:
          $ref: "#/components/schemas/Actor"

    StaffMembership:
      type: object
      additionalProperties: false
      required: [slug, name, workos_organization_id, role]
      properties:
        slug:
          type: string
        name:
          type: string
        workos_organization_id:
          type: string
          description: The WorkOS organization ID. The portal uses it to switch the session.
        role:
          type: string
          description: Role slug from the last verified token or sync. Display only.

    Actor:
      type: object
      additionalProperties: false
      required: [name, email, demo, permissions]
      properties:
        name:
          type: string
        email:
          type: string
        demo:
          type: boolean
          description: True when the local demo token authenticated the request.
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    StaffOverview:
      type: object
      additionalProperties: false
      required:
        - member_count
        - active_membership_count
        - unpaid_sale_count
        - awaiting_fulfillment_count
        - check_ins_today
      properties:
        member_count:
          type: integer
        active_membership_count:
          type: integer
          description: Members with a membership period covering now.
        unpaid_sale_count:
          type: integer
          description: Sales with a balance above zero.
        awaiting_fulfillment_count:
          type: integer
          description: Fully paid sales that are not fulfilled.
        check_ins_today:
          type: object
          additionalProperties: false
          required: [granted, denied]
          description: Counts since midnight in the organization's time zone.
          properties:
            granted:
              type: integer
            denied:
              type: integer

    MemberInput:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320

    MemberSummary:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string

    Member:
      type: object
      additionalProperties: false
      required: [id, name, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time

    MemberDetail:
      type: object
      additionalProperties: false
      required: [id, name, email, created_at, membership, current_period, renewal, entitlements]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        membership:
          allOf:
            - $ref: "#/components/schemas/Membership"
          nullable: true
        current_period:
          allOf:
            - $ref: "#/components/schemas/MembershipPeriod"
          nullable: true
          description: The period that covers now, if any.
        renewal:
          allOf:
            - $ref: "#/components/schemas/RenewalTerms"
          nullable: true
        entitlements:
          type: array
          description: Rights that are active now or start later. Expired rights are left out.
          items:
            $ref: "#/components/schemas/Entitlement"

    Membership:
      type: object
      additionalProperties: false
      required: [id, created_at, periods]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        periods:
          type: array
          description: All periods, oldest first. Periods never overlap.
          items:
            $ref: "#/components/schemas/MembershipPeriod"

    MembershipPeriod:
      type: object
      additionalProperties: false
      required: [id, membership_id, sale_id, fulfillment_id, starts_at, ends_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        membership_id:
          type: string
          format: uuid
        sale_id:
          type: string
          format: uuid
        fulfillment_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
          description: Inclusive.
        ends_at:
          type: string
          format: date-time
          description: Exclusive.
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: Set when staff revoked this period. It then grants no access.

    Entitlement:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - name
        - starts_at
        - ends_at
        - location_id
        - usage_limit
        - used_count
        - remaining
        - active
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/BenefitKind"
        name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        location_id:
          type: string
          format: uuid
          nullable: true
          description: Null means every location of the organization.
        usage_limit:
          type: integer
          nullable: true
          description: Null means unlimited.
        used_count:
          type: integer
        remaining:
          type: integer
          nullable: true
          description: Null means unlimited.
        active:
          type: boolean
          description: True when now is inside the validity window.

    BenefitKind:
      type: string
      enum: [gym_access]

    Benefit:
      type: object
      additionalProperties: false
      required: [id, kind, name, usage_limit, location_id]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/BenefitKind"
        name:
          type: string
        usage_limit:
          type: integer
          nullable: true
          description: Uses per period. Null means unlimited.
        location_id:
          type: string
          format: uuid
          nullable: true
          description: Null means every location.

    PublicBenefit:
      type: object
      additionalProperties: false
      required: [kind, name, usage_limit, location_name]
      properties:
        kind:
          $ref: "#/components/schemas/BenefitKind"
        name:
          type: string
        usage_limit:
          type: integer
          nullable: true
        location_name:
          type: string
          nullable: true
          description: Null means every location.

    Price:
      type: object
      additionalProperties: false
      required: [id, label, amount_minor, currency, duration_days, available, archived_at]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        amount_minor:
          type: integer
          minimum: 0
        currency:
          type: string
        duration_days:
          type: integer
          minimum: 1
          description: Fixed duration of each membership period.
        available:
          type: boolean
          description: True when the price can be used for a new sale.
        archived_at:
          type: string
          format: date-time
          nullable: true

    PublicPrice:
      type: object
      additionalProperties: false
      required: [id, label, amount_minor, currency, duration_days]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        amount_minor:
          type: integer
        currency:
          type: string
        duration_days:
          type: integer

    PublicProduct:
      type: object
      additionalProperties: false
      required: [id, name, description, benefits, prices]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        benefits:
          type: array
          items:
            $ref: "#/components/schemas/PublicBenefit"
        prices:
          type: array
          items:
            $ref: "#/components/schemas/PublicPrice"

    StaffProduct:
      type: object
      additionalProperties: false
      required: [id, name, description, published, benefits, prices]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        published:
          type: boolean
        benefits:
          type: array
          items:
            $ref: "#/components/schemas/Benefit"
        prices:
          type: array
          items:
            $ref: "#/components/schemas/Price"

    SaleInput:
      type: object
      additionalProperties: false
      required: [member_id, price_id, location_id]
      properties:
        member_id:
          type: string
          format: uuid
        price_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
          description: Where the sale happened.

    PaymentMethod:
      type: string
      enum: [cash, bank_transfer]

    PaymentInput:
      type: object
      additionalProperties: false
      required: [amount_minor, method]
      properties:
        amount_minor:
          type: integer
          minimum: 1
        method:
          $ref: "#/components/schemas/PaymentMethod"
        reference:
          type: string
          maxLength: 200
          nullable: true
          description: Optional receipt or bank reference.

    CheckInInput:
      type: object
      additionalProperties: false
      required: [member_id, location_id]
      properties:
        member_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid

    SaleLineItemTerms:
      type: object
      additionalProperties: false
      required: [duration_days, benefits]
      description: Terms snapshotted at purchase. Later catalog edits never change them.
      properties:
        duration_days:
          type: integer
        benefits:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, name, usage_limit, location_id]
            properties:
              kind:
                $ref: "#/components/schemas/BenefitKind"
              name:
                type: string
              usage_limit:
                type: integer
                nullable: true
              location_id:
                type: string
                format: uuid
                nullable: true

    SaleLineItem:
      type: object
      additionalProperties: false
      required:
        - id
        - price_id
        - product_id
        - product_name
        - price_label
        - quantity
        - unit_amount_minor
        - total_minor
        - currency
        - terms
      properties:
        id:
          type: string
          format: uuid
        price_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        price_label:
          type: string
        quantity:
          type: integer
          enum: [1]
        unit_amount_minor:
          type: integer
        total_minor:
          type: integer
        currency:
          type: string
        terms:
          $ref: "#/components/schemas/SaleLineItemTerms"

    Payment:
      type: object
      additionalProperties: false
      required: [id, amount_minor, currency, method, reference, received_at, refunded_minor]
      properties:
        id:
          type: string
          format: uuid
        amount_minor:
          type: integer
        currency:
          type: string
        method:
          $ref: "#/components/schemas/PaymentMethod"
        reference:
          type: string
          nullable: true
        received_at:
          type: string
          format: date-time
        refunded_minor:
          type: integer
          description: Total refunded against this payment.

    Fulfillment:
      type: object
      additionalProperties: false
      required: [id, sale_line_item_id, membership_id, membership_period, fulfilled_at, early, early_reason, unpaid_minor, revoked_at, revoke_reason]
      properties:
        id:
          type: string
          format: uuid
        sale_line_item_id:
          type: string
          format: uuid
        membership_id:
          type: string
          format: uuid
        membership_period:
          $ref: "#/components/schemas/MembershipPeriod"
        fulfilled_at:
          type: string
          format: date-time
        early:
          type: boolean
          description: True when staff delivered before full payment.
        early_reason:
          type: string
          nullable: true
        unpaid_minor:
          type: integer
          description: Balance still due at delivery. Zero for a normal delivery.
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revoke_reason:
          type: string
          nullable: true

    PaymentStatus:
      type: string
      enum: [unpaid, partially_paid, paid, void]

    Sale:
      type: object
      additionalProperties: false
      required:
        - id
        - member
        - location_id
        - currency
        - total_minor
        - paid_minor
        - balance_minor
        - payment_status
        - fulfilled
        - renewal
        - refunded_minor
        - voided_at
        - void_reason
        - refunds
        - purchased_at
        - line_item
        - payments
        - fulfillment
      properties:
        id:
          type: string
          format: uuid
        member:
          $ref: "#/components/schemas/MemberSummary"
        location_id:
          type: string
          format: uuid
        currency:
          type: string
        total_minor:
          type: integer
        paid_minor:
          type: integer
        balance_minor:
          type: integer
        payment_status:
          $ref: "#/components/schemas/PaymentStatus"
        fulfilled:
          type: boolean
        renewal:
          type: boolean
          description: True when the sale renews the member's agreed terms.
        refunded_minor:
          type: integer
          description: Total refunded. `paid_minor` stays the total received.
        voided_at:
          type: string
          format: date-time
          nullable: true
        void_reason:
          type: string
          nullable: true
        refunds:
          type: array
          items:
            $ref: "#/components/schemas/Refund"
        purchased_at:
          type: string
          format: date-time
        line_item:
          $ref: "#/components/schemas/SaleLineItem"
        payments:
          type: array
          description: Oldest first.
          items:
            $ref: "#/components/schemas/Payment"
        fulfillment:
          allOf:
            - $ref: "#/components/schemas/Fulfillment"
          nullable: true

    SaleResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Sale"

    CheckInResult:
      type: string
      enum: [granted, denied]

    DenialReason:
      type: string
      description: |
        - `no_entitlement`: no right is valid at this time.
        - `location_not_allowed`: a right is valid now but not at this location.
        - `usage_limit_reached`: every matching right has no uses left.
      enum: [no_entitlement, location_not_allowed, usage_limit_reached]

    CheckIn:
      type: object
      additionalProperties: false
      required:
        - id
        - member
        - location_id
        - result
        - denial_reason
        - entitlement_id
        - checked_in_at
      properties:
        id:
          type: string
          format: uuid
        member:
          $ref: "#/components/schemas/MemberSummary"
        location_id:
          type: string
          format: uuid
        result:
          $ref: "#/components/schemas/CheckInResult"
        denial_reason:
          allOf:
            - $ref: "#/components/schemas/DenialReason"
          nullable: true
        entitlement_id:
          type: string
          format: uuid
          nullable: true
          description: The right used by a granted check-in.
        checked_in_at:
          type: string
          format: date-time

    CheckInResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CheckIn"

    BenefitInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        usage_limit:
          type: integer
          minimum: 1
          nullable: true
          description: Uses per period. Null or absent means unlimited.
        location_id:
          type: string
          format: uuid
          nullable: true
          description: Null or absent means every location.

    ProductInput:
      type: object
      additionalProperties: false
      required: [name, benefits]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        published:
          type: boolean
          description: Shown on the gym site. Defaults to false.
        benefits:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/BenefitInput"

    ProductUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        published:
          type: boolean
        benefits:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/BenefitInput"

    PriceInput:
      type: object
      additionalProperties: false
      required: [label, amount_minor, duration_days]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        amount_minor:
          type: integer
          minimum: 0
        duration_days:
          type: integer
          minimum: 1
          maximum: 3660

    PriceUpdate:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        available:
          type: boolean

    StaffProductResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/StaffProduct"

    RenewalInput:
      type: object
      additionalProperties: false
      required: [location_id]
      properties:
        location_id:
          type: string
          format: uuid
          description: Where the renewal is sold.

    RenewalTerms:
      type: object
      additionalProperties: false
      required: [product_name, price_label, amount_minor, currency, duration_days, starts_at]
      description: What a renewal sells now. Null on the member when nothing was delivered yet.
      properties:
        product_name:
          type: string
        price_label:
          type: string
        amount_minor:
          type: integer
        currency:
          type: string
        duration_days:
          type: integer
        starts_at:
          type: string
          format: date-time
          description: Where the new period starts if it is delivered now.

    FulfillInput:
      type: object
      additionalProperties: false
      properties:
        early_reason:
          type: string
          maxLength: 500
          description: Why staff deliver before full payment. Needs purchases:fulfill_unpaid. Ignored when the sale is paid in full.

    RefundInput:
      type: object
      additionalProperties: false
      required: [payment_id, amount_minor, reason]
      properties:
        payment_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500

    ReasonInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500

    Refund:
      type: object
      additionalProperties: false
      required: [id, payment_id, amount_minor, currency, reason, refunded_at]
      properties:
        id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
        currency:
          type: string
        reason:
          type: string
        refunded_at:
          type: string
          format: date-time

    OrganizationUpdate:
      type: object
      additionalProperties: false
      properties:
        timezone:
          type: string
          description: IANA time zone, for example `Asia/Kuala_Lumpur`.
        published:
          type: boolean
          description: Shows the gym site and its published offers.

    StaffOrganizationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/StaffOrganization"

    LocationInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          nullable: true
          maxLength: 300

    LocationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Location"

    InvitationInput:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        role:
          type: string
          description: A role slug from `roles`.

    RoleInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string

    TeamMember:
      type: object
      additionalProperties: false
      required: [id, name, email, role, role_name, status, you, manageable]
      properties:
        id:
          type: string
          format: uuid
          description: The local membership ID.
        name:
          type: string
        email:
          type: string
        role:
          type: string
        role_name:
          type: string
        status:
          type: string
          enum: [active, inactive, pending]
        you:
          type: boolean
        manageable:
          type: boolean
          description: True when the actor may change this member. The last-manager rule is checked on change.

    TeamInvitation:
      type: object
      additionalProperties: false
      required: [id, email, role, state, expires_at, accept_url]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          nullable: true
        state:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        accept_url:
          type: string
          nullable: true
          description: The WorkOS link the invitee opens. WorkOS also emails it.

    TeamRole:
      type: object
      additionalProperties: false
      required: [slug, name, permissions, grantable]
      properties:
        slug:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        grantable:
          type: boolean
          description: True when the actor holds every permission of this role.

    Team:
      type: object
      additionalProperties: false
      required: [members, invitations, roles]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/TeamInvitation"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TeamRole"

    TeamResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Team"
