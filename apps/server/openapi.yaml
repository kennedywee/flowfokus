        email:
          type: string
        role:
          type: string
        role_name:
          type: string
        status:
          type: string
          enum: [active, inactive, pending]
        you:
          type: boolean
        manageable:
          type: boolean
          description: True when the actor may change this member. The last-manager rule is checked on change.

    TeamInvitation:
      type: object
      additionalProperties: false
      required: [id, email, role, state, expires_at, accept_url]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          nullable: true
        state:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        accept_url:
          type: string
          nullable: true
          description: The WorkOS link the invitee opens. WorkOS also emails it.

    TeamRole:
      type: object
      additionalProperties: false
      required: [slug, name, permissions, grantable]
      properties:
        slug:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        grantable:
          type: boolean
          description: True when the actor holds every permission of this role.

    Team:
      type: object
      additionalProperties: false
      required: [members, invitations, roles]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/TeamInvitation"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TeamRole"

    TeamResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Team"

    LinkCodeInput:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
          description: The code from the front desk. Dashes, spaces, and case are ignored.

    MemberLinkCode:
      type: object
      additionalProperties: false
      required: [member_id, code, expires_at]
      properties:
        member_id:
          type: string
          format: uuid
        code:
          type: string
          example: K7Q2-M9XD-4HPR
        expires_at:
          type: string
          format: date-time

    MemberLinkCodeResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MemberLinkCode"

    MemberDetailResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/MemberDetail"

    MemberCheckIn:
      type: object
      additionalProperties: false
      required: [id, location_name, result, denial_reason, overridden, checked_in_at]
      properties:
        id:
          type: string
          format: uuid
        location_name:
          type: string
        result:
          $ref: "#/components/schemas/CheckInResult"
        denial_reason:
          allOf:
            - $ref: "#/components/schemas/DenialReason"
          nullable: true
        overridden:
          type: boolean
          description: True when staff let the member in despite a denial.
        checked_in_at:
          type: string
          format: date-time

    MemberSale:
      type: object
      additionalProperties: false
      required: [id, product_name, price_label, currency, channel, total_minor, paid_minor, balance_minor, refunded_minor, fulfilled, purchased_at]
      properties:
        channel:
          $ref: "#/components/schemas/SaleChannel"
        id:
          type: string
          format: uuid
        product_name:
          type: string
        price_label:
          type: string
        currency:
          type: string
        total_minor:
          type: integer
        paid_minor:
          type: integer
        balance_minor:
          type: integer
        refunded_minor:
          type: integer
        fulfilled:
          type: boolean
        purchased_at:
          type: string
          format: date-time

    MemberAccount:
      type: object
      additionalProperties: false
      required: [id, name, email, created_at, membership, current_period, entitlements, check_ins, sales, bookings]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        membership:
          allOf:
            - $ref: "#/components/schemas/Membership"
          nullable: true
        current_period:
          allOf:
            - $ref: "#/components/schemas/MembershipPeriod"
          nullable: true
        entitlements:
          type: array
          items:
            $ref: "#/components/schemas/Entitlement"
        check_ins:
          type: array
          description: The 20 latest visits, newest first.
          items:
            $ref: "#/components/schemas/MemberCheckIn"
        sales:
          type: array
          description: The 20 latest purchases that are not void, newest first.
          items:
            $ref: "#/components/schemas/MemberSale"
        bookings:
          type: array
          description: Coming bookings, then the 10 latest earlier ones.
          items:
            $ref: "#/components/schemas/MemberBooking"

