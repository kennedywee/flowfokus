        product_name:
          type: string
        price_label:
          type: string
        amount_minor:
          type: integer
        currency:
          type: string
        duration_days:
          type: integer
        starts_at:
          type: string
          format: date-time
          description: Where the new period starts if it is delivered now.

    FulfillInput:
      type: object
      additionalProperties: false
      properties:
