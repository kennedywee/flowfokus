      type: string
      description: "`membership` and `pass` are offers. A `ticket` is made from a program and buys one spot at one time."
      enum: [membership, pass, ticket]

    SaleChannel:
      type: string
      description: "`desk` sales are recorded by staff. `online` sales come from a paid checkout and have no sale location."
      enum: [desk, online]

    SaleOccurrence:
      type: object
      additionalProperties: false
      required: [id, program_id, program_name, starts_at, ends_at]
      properties:
        id:
          type: string
          format: uuid
        program_id:
          type: string
          format: uuid
        program_name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    ProgramKind:
      type: string
      enum: [group_class, event, appointment]

    Program:
      type: object
      additionalProperties: false
      required: [id, name, description, kind, location_id, capacity, duration_minutes, host_name, published, created_at]
      properties:
