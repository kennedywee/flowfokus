  /webhooks/workos:
    post:
      tags: [webhooks]
      operationId: receiveWorkosWebhook
      summary: Receives a signed WorkOS event.
      description: |
        Called by WorkOS only. No Bearer token and no `Flowfokus-Organization` header.
        Rails checks the `WorkOS-Signature` header against the raw body before it reads
        any JSON: HMAC-SHA256 with `WORKOS_WEBHOOK_SECRET` over `<t>.<raw body>`, and
        `t` (milliseconds) within 3 minutes of the server clock.

        A verified event is saved to the event ledger before processing, then
        processed in the background. A redelivered event answers 200 with
        `duplicate: true` and changes nothing. Unsupported event types are saved
        and ignored. Production answers 503 until `WORKOS_VERIFIED=true`.
      security: []
      parameters:
        - name: WorkOS-Signature
          in: header
          required: true
          description: "`t=<milliseconds since epoch>, v1=<hex HMAC-SHA256>`"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkosWebhookEvent"
      responses:
        "200":
          description: The event is saved. Processing happens later.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/WorkosWebhookReceipt"
        "400":
          description: "`invalid_signature` for a missing, malformed, mismatched, or expired signature. `bad_request` for a signed body that is not a WorkOS event."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkosWebhookErrorResponse"
        "413":
          description: "`payload_too_large`: the body is larger than 1 MB."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkosWebhookErrorResponse"
        "500":
          description: "`internal_error`: an unexpected server failure. WorkOS retries the delivery."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkosWebhookErrorResponse"
        "503":
          description: "`webhook_not_configured`: no webhook secret, or WorkOS is not verified in production. `database_unavailable`: the ledger cannot be reached."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkosWebhookErrorResponse"

components:
  securitySchemes:
    organizationHeader:
      type: apiKey
      in: header
      name: Flowfokus-Organization
      description: |
        Gym slug, for example `chainsaw`. Required on every `/public/*`, `/staff/*`, and
        `/member/*` call. It selects the organization; it never grants access by itself.
        Modeled as a scheme so the shared client can set it once.
    bearerAuth:
      type: http
      scheme: bearer
      description: WorkOS AuthKit access token, or the local demo token (development and test only).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per logical request. 8 to 255 printable ASCII characters. A UUID works well.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    InvitationIdPath:
      name: invitation_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^invitation_[A-Za-z0-9]{1,100}$"
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Missing header or malformed request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid Bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The actor lacks access to this organization or permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Unknown organization or record.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Idempotency-Key reused with a different request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: "`rate_limited`: too many requests from this client IP. Try again later."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unprocessable:
      description: Validation or business rule failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Authentication is not configured, or a dependency is down.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              enum: [ok]

    ErrorCode:
      type: string
      description: |
        Stable machine-readable error code.
        - `bad_request` (400), `organization_required` (400), `idempotency_key_required` (400)
        - `unauthenticated` (401), `invalid_token` (401)
        - `forbidden` (403), `organization_mismatch` (403)
        - `not_found` (404)
        - `idempotency_key_reused` (409)
        - `validation_failed`, `price_unavailable`, `renewal_unavailable`, `overpayment`, `sale_not_paid`,
          `sale_voided`, `sale_not_voidable`, `sale_not_delivered`, `refund_exceeds_payment`,
          `staff_change_refused`, `workos_rejected`, `link_code_invalid`, `member_already_linked`,
          `schedule_invalid`, `occurrence_full`, `occurrence_unavailable`, `occurrence_required`,
          `booking_not_allowed`, `checkout_closed`, `attendees_invalid` (422)
        - `member_not_linked` (403)
        - `rate_limited` (429)
        - `internal_error` (500)
        - `auth_not_configured`, `auth_unavailable`, `database_unavailable`, `workos_unavailable`, `payments_unavailable` (503)
      x-extensible-enum:
        - bad_request
        - organization_required
        - idempotency_key_required
        - unauthenticated
        - invalid_token
        - forbidden
        - organization_mismatch
        - not_found
        - idempotency_key_reused
        - validation_failed
        - price_unavailable
        - renewal_unavailable
        - overpayment
        - sale_not_paid
        - sale_voided
        - sale_not_voidable
        - sale_not_delivered
        - refund_exceeds_payment
        - staff_change_refused
        - workos_rejected
        - link_code_invalid
        - member_already_linked
        - member_not_linked
        - schedule_invalid
        - occurrence_full
        - occurrence_unavailable
        - occurrence_required
        - booking_not_allowed
        - checkout_closed
        - attendees_invalid
        - payments_unavailable
        - rate_limited
        - internal_error
        - auth_not_configured
        - auth_unavailable
        - database_unavailable
        - workos_unavailable

    WorkosWebhookEvent:
      type: object
      description: A WorkOS event, as WorkOS sends it. Other fields are allowed and kept.
      required: [id, event, data, created_at]
      properties:
        id:
          type: string
          description: WorkOS event ID. Unique; redeliveries repeat it.
        event:
          type: string
          example: organization_membership.updated
        data:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
      additionalProperties: true

    WorkosWebhookReceipt:
      type: object
      additionalProperties: false
      required: [id, event, status, duplicate]
      properties:
        id:
          type: string
          description: The WorkOS event ID.
        event:
          type: string
        status:
          type: string
          enum: [pending, processed, ignored, failed]
          description: Ledger status. A new event is usually `pending`.
        duplicate:
          type: boolean
          description: True when the ledger already had this event.

    WorkosWebhookErrorCode:
      type: string
      description: |
        Error codes of `POST /webhooks/workos` only. Separate from `ErrorCode`,
        so the webhook codes do not widen the responses of other endpoints.
        - `bad_request`, `invalid_signature` (400)
        - `payload_too_large` (413)
        - `internal_error` (500)
        - `webhook_not_configured`, `database_unavailable` (503)
      enum:
        - bad_request
        - invalid_signature
        - payload_too_large
        - internal_error
        - webhook_not_configured
        - database_unavailable

    WorkosWebhookErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/WorkosWebhookErrorCode"
            message:
              type: string

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            details:
              type: object
              description: For `validation_failed`, maps a field name to a list of messages.
              additionalProperties:
                type: array
                items:
                  type: string

    PublicOrganization:
      type: object
      additionalProperties: false
      required: [slug, name, timezone, currency, online_payments, locations]
      properties:
        online_payments:
          type: boolean
          description: True when members can pay online on the gym site.
        slug:
          type: string
        name:
          type: string
        timezone:
          type: string
          description: IANA time zone, for example `Asia/Kuala_Lumpur`.
        currency:
          type: string
          description: ISO 4217 code.
        locations:
          type: array
          items:
            $ref: "#/components/schemas/PublicLocation"

    PublicLocation:
      type: object
      additionalProperties: false
      required: [name, address]
      properties:
        name:
          type: string
        address:
          type: string
          nullable: true

    Location:
      type: object
      additionalProperties: false
      required: [id, name, address]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
          nullable: true

    Permission:
      type: string
      enum:
        - members:read
        - members:create
        - members:link
        - products:read
        - products:create
        - products:update
        - purchases:read
        - purchases:create
        - purchases:fulfill
        - purchases:fulfill_unpaid
        - payments:create
        - purchases:refund
        - purchases:void
        - memberships:revoke
        - check_ins:read
        - check_ins:create
        - check_ins:override
        - programs:read
        - programs:manage
        - bookings:create
        - bookings:manage
        - settings:manage
        - staff:manage

    StaffOrganization:
      type: object
      additionalProperties: false
      required: [id, slug, name, timezone, currency, published, locations, actor]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        timezone:
          type: string
        currency:
          type: string
        published:
          type: boolean
          description: True when the gym site is public.
        locations:
          type: array
          items:
            $ref: "#/components/schemas/Location"
        actor:
          $ref: "#/components/schemas/Actor"

    StaffMembership:
      type: object
      additionalProperties: false
      required: [slug, name, workos_organization_id, role]
      properties:
        slug:
          type: string
        name:
          type: string
        workos_organization_id:
          type: string
          description: The WorkOS organization ID. The portal uses it to switch the session.
        role:
          type: string
          description: Role slug from the last verified token or sync. Display only.

    Actor:
      type: object
      additionalProperties: false
      required: [name, email, demo, permissions]
      properties:
        name:
          type: string
        email:
          type: string
        demo:
          type: boolean
          description: True when the local demo token authenticated the request.
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"

    StaffOverview:
      type: object
      additionalProperties: false
      required:
        - member_count
        - active_membership_count
        - unpaid_sale_count
        - awaiting_fulfillment_count
        - check_ins_today
      properties:
        member_count:
          type: integer
        active_membership_count:
          type: integer
          description: Members with a membership period covering now.
        unpaid_sale_count:
          type: integer
          description: Sales with a balance above zero.
        awaiting_fulfillment_count:
          type: integer
          description: Fully paid sales that are not fulfilled.
        check_ins_today:
          type: object
          additionalProperties: false
          required: [granted, denied]
          description: Counts since midnight in the organization's time zone.
          properties:
            granted:
              type: integer
            denied:
              type: integer
        currency:
          type: string
          description: The organization's currency, for the amounts in `money`.
        new_members_today:
          type: integer
          description: Members added since midnight in the organization's time zone.
        memberships_ending_count:
          type: integer
          description: Memberships whose access ends within seven days, with no later period.
        setup:
          type: object
          additionalProperties: false
          required: [location, product, member, sale]
          description: First-run progress. Each fact is true once the organization has at least one such record.
          properties:
            location:
              type: boolean
            product:
              type: boolean
            member:
              type: boolean
            sale:
              type: boolean
        money:
          $ref: "#/components/schemas/StaffOverviewMoney"

    StaffOverviewMoney:
      type: object
      additionalProperties: false
      required: [sales_today, collected_today_minor, payments_today, due, awaiting_fulfillment]
      description: Money facts. Left out for staff without `purchases:read`. "Today" starts at midnight in the organization's time zone.
      properties:
        sales_today:
          type: object
          additionalProperties: false
          required: [count, total_minor]
          description: Sales recorded today, at their total. Void sales are left out.
          properties:
            count:
              type: integer
            total_minor:
              type: integer
        collected_today_minor:
          type: integer
          description: Payments recorded today. Refunds are not taken off.
        payments_today:
          type: array
          description: Payments recorded today, one entry per payment method.
          items:
            type: object
            additionalProperties: false
            required: [method, amount_minor]
            properties:
              method:
                $ref: "#/components/schemas/PaymentMethod"
              amount_minor:
                type: integer
        due:
          type: object
          additionalProperties: false
          required: [total_minor, oldest_sale]
          description: The balance on open sales that are not fully paid.
          properties:
            total_minor:
              type: integer
            oldest_sale:
              type: [object, "null"]
              additionalProperties: false
              required: [id, purchased_at]
              properties:
                id:
                  type: string
                  format: uuid
                purchased_at:
                  type: string
                  format: date-time
        awaiting_fulfillment:
          type: array
          maxItems: 3
          description: The oldest fully paid sales that are not fulfilled. `awaiting_fulfillment_count` has the full count.
          items:
            type: object
            additionalProperties: false
            required: [sale_id, member_name]
            properties:
              sale_id:
                type: string
                format: uuid
              member_name:
                type: string

    MemberInput:
      type: object
      additionalProperties: false
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320

    MemberSummary:
      type: object
      additionalProperties: false
      required: [id, name, email]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string

    Member:
      type: object
      additionalProperties: false
      required: [id, name, email, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time

    MemberDetail:
      type: object
      additionalProperties: false
      required: [id, name, email, created_at, linked_email, membership, current_period, renewal, entitlements, bookings]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        created_at:
          type: string
          format: date-time
        membership:
          allOf:
            - $ref: "#/components/schemas/Membership"
          nullable: true
        current_period:
          allOf:
            - $ref: "#/components/schemas/MembershipPeriod"
          nullable: true
          description: The period that covers now, if any.
        renewal:
          allOf:
            - $ref: "#/components/schemas/RenewalTerms"
          nullable: true
        linked_email:
          type: string
          nullable: true
          description: The email of the sign-in linked to this member, if any.
        entitlements:
          type: array
          description: Rights that are active now or start later. Expired rights are left out.
          items:
            $ref: "#/components/schemas/Entitlement"
        bookings:
          type: array
          description: Coming bookings, then the 10 latest earlier ones.
          items:
            $ref: "#/components/schemas/Booking"

    Membership:
      type: object
      additionalProperties: false
      required: [id, created_at, periods]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        periods:
          type: array
          description: All periods, oldest first. Periods never overlap.
          items:
            $ref: "#/components/schemas/MembershipPeriod"

    MembershipPeriod:
      type: object
      additionalProperties: false
      required: [id, membership_id, sale_id, fulfillment_id, starts_at, ends_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        membership_id:
          type: string
          format: uuid
        sale_id:
          type: string
          format: uuid
        fulfillment_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
          description: Inclusive.
        ends_at:
          type: string
          format: date-time
          description: Exclusive.
        revoked_at:
          type: string
          format: date-time
          nullable: true
          description: Set when staff revoked this period. It then grants no access.

    Entitlement:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - name
        - starts_at
        - ends_at
        - location_id
        - usage_limit
        - used_count
        - remaining
        - active
        - program_ids
        - program_kind
        - occurrence_id
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/BenefitKind"
        name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        location_id:
          type: string
          format: uuid
          nullable: true
          description: Null means every location of the organization.
        usage_limit:
          type: integer
          nullable: true
          description: Null means unlimited.
        used_count:
          type: integer
        remaining:
          type: integer
          nullable: true
          description: Null means unlimited.
        active:
          type: boolean
          description: True when now is inside the validity window.
        program_ids:
          type: array
          description: Program access only. Selected programs. Empty means the kind decides.
          items:
            type: string
            format: uuid
        program_kind:
          allOf:
            - $ref: "#/components/schemas/ProgramKind"
          nullable: true
          description: Program access only. With no selected programs, every program of this kind. Null means every program.
        occurrence_id:
          type: string
          format: uuid
          nullable: true
          description: A ticket's right is valid for this one time only.

    BenefitKind:
      type: string
      description: "`gym_access` opens the gym floor at check-in. `program_access` books spots in programs."
      enum: [gym_access, program_access]

    Benefit:
      type: object
      additionalProperties: false
      required: [id, kind, name, usage_limit, location_id, program_ids, program_kind]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/BenefitKind"
        name:
          type: string
        usage_limit:
          type: integer
          nullable: true
          description: Uses per period. Null means unlimited.
        location_id:
          type: string
          format: uuid
          nullable: true
          description: Null means every location.
        program_ids:
          type: array
          items:
            type: string
            format: uuid
        program_kind:
          allOf:
            - $ref: "#/components/schemas/ProgramKind"
          nullable: true

    PublicBenefit:
      type: object
      additionalProperties: false
      required: [kind, name, usage_limit, location_name, program_kind, program_names]
      properties:
        program_kind:
          allOf:
            - $ref: "#/components/schemas/ProgramKind"
          nullable: true
        program_names:
          type: array
          description: Selected published programs. Empty means the kind, or every program.
          items:
            type: string
        kind:
          $ref: "#/components/schemas/BenefitKind"
        name:
          type: string
        usage_limit:
          type: integer
          nullable: true
        location_name:
          type: string
          nullable: true
          description: Null means every location.

    Price:
      type: object
      additionalProperties: false
      required: [id, label, amount_minor, currency, duration_days, available, archived_at]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        amount_minor:
          type: integer
          minimum: 0
        currency:
          type: string
        duration_days:
          type: integer
          minimum: 1
          nullable: true
          description: Days of access from delivery. Null for a ticket, which lasts until its time ends.
        available:
          type: boolean
          description: True when the price can be used for a new sale.
        archived_at:
          type: string
          format: date-time
          nullable: true

    PublicPrice:
      type: object
      additionalProperties: false
      required: [id, label, amount_minor, currency, duration_days]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        amount_minor:
          type: integer
        currency:
          type: string
        duration_days:
          type: integer
          nullable: true

    PublicProduct:
      type: object
      additionalProperties: false
      required: [id, name, description, kind, benefits, prices]
      properties:
        kind:
          $ref: "#/components/schemas/ProductKind"
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        benefits:
          type: array
          items:
            $ref: "#/components/schemas/PublicBenefit"
        prices:
          type: array
          items:
            $ref: "#/components/schemas/PublicPrice"

    StaffProduct:
      type: object
      additionalProperties: false
      required: [id, name, description, published, kind, program_id, benefits, prices]
      properties:
        kind:
          $ref: "#/components/schemas/ProductKind"
        program_id:
          type: string
          format: uuid
          nullable: true
          description: The program a ticket was made from. Null for other kinds.
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        published:
          type: boolean
        benefits:
          type: array
          items:
            $ref: "#/components/schemas/Benefit"
        prices:
          type: array
          items:
            $ref: "#/components/schemas/Price"

    SaleInput:
      type: object
      additionalProperties: false
      required: [member_id, price_id, location_id]
      properties:
        member_id:
          type: string
          format: uuid
        price_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
          description: Where the sale happened.
        occurrence_id:
          type: string
          format: uuid
          description: Required for a ticket, and only for a ticket. Delivery books this time.
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          default: 1
          description: Spots to buy. Above 1 for a ticket only.
        attendees:
          type: array
          maxItems: 10
          description: |
            Who comes to each spot, one entry per spot. Omit for one spot taken by the buyer.
            The buyer holds the right that pays for every spot.
          items:
            $ref: "#/components/schemas/AttendeeInput"

    AttendeeInput:
      type: object
      additionalProperties: false
      description: A member of this gym, or a guest by name.
      properties:
        member_id:
          type: string
          format: uuid
        guest_name:
          type: string
          minLength: 1
          maxLength: 200
        guest_email:
          type: string
          nullable: true
          maxLength: 320

    MemberAttendeeInput:
      type: object
      additionalProperties: false
      description: The signed-in member (`self`), or a guest by name. Members cannot name other members.
      properties:
        self:
          type: boolean
        guest_name:
          type: string
          minLength: 1
          maxLength: 200
        guest_email:
          type: string
          nullable: true
          maxLength: 320

    SaleAttendee:
      type: object
      additionalProperties: false
      required: [member_id, name, guest]
      properties:
        member_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        guest:
          type: boolean

    PaymentMethod:
      type: string
      description: "`online` payments come from a payment provider through a checkout."
      enum: [cash, bank_transfer, online]

    ManualPaymentMethod:
      type: string
      enum: [cash, bank_transfer]

    PaymentInput:
      type: object
      additionalProperties: false
      required: [amount_minor, method]
      properties:
        amount_minor:
          type: integer
          minimum: 1
        method:
          $ref: "#/components/schemas/ManualPaymentMethod"
        reference:
          type: string
          maxLength: 200
          nullable: true
          description: Optional receipt or bank reference.

    CheckInInput:
      type: object
      additionalProperties: false
      required: [member_id, location_id]
      properties:
        member_id:
          type: string
          format: uuid
        location_id:
          type: string
          format: uuid
        override_reason:
          type: string
          maxLength: 500
          description: Let the member in even if their rights deny it. Needs check_ins:override.

    SaleLineItemTerms:
      type: object
      additionalProperties: false
      required: [kind, duration_days, benefits]
      description: Terms snapshotted at purchase. Later catalog edits never change them.
      properties:
        kind:
          $ref: "#/components/schemas/ProductKind"
        duration_days:
          type: integer
          nullable: true
          description: Null for a ticket.
        benefits:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, name, usage_limit, location_id, program_ids, program_kind]
            properties:
              program_ids:
                type: array
                items:
                  type: string
                  format: uuid
              program_kind:
                allOf:
                  - $ref: "#/components/schemas/ProgramKind"
                nullable: true
              kind:
                $ref: "#/components/schemas/BenefitKind"
              name:
                type: string
              usage_limit:
                type: integer
                nullable: true
              location_id:
                type: string
                format: uuid
                nullable: true

    SaleLineItem:
      type: object
      additionalProperties: false
      required:
        - id
        - price_id
        - product_id
        - product_name
        - price_label
        - quantity
        - unit_amount_minor
        - total_minor
        - currency
        - terms
      properties:
        id:
          type: string
          format: uuid
        price_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        price_label:
          type: string
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          description: Spots on a ticket line. Always 1 for a membership or a pass.
        unit_amount_minor:
          type: integer
        total_minor:
          type: integer
        currency:
          type: string
        terms:
          $ref: "#/components/schemas/SaleLineItemTerms"

    Payment:
      type: object
      additionalProperties: false
      required: [id, amount_minor, currency, method, provider, reference, received_at, refunded_minor]
      properties:
        provider:
          type: string
          nullable: true
          description: The payment provider for an online payment, for example `test`.
        id:
          type: string
          format: uuid
        amount_minor:
          type: integer
        currency:
          type: string
        method:
          $ref: "#/components/schemas/PaymentMethod"
        reference:
          type: string
          nullable: true
        received_at:
          type: string
          format: date-time
        refunded_minor:
          type: integer
          description: Total refunded against this payment.

    Fulfillment:
      type: object
      additionalProperties: false
      required: [id, sale_line_item_id, membership_id, membership_period, fulfilled_at, early, early_reason, unpaid_minor, revoked_at, revoke_reason]
      properties:
        id:
          type: string
          format: uuid
        sale_line_item_id:
          type: string
          format: uuid
        membership_id:
          type: string
          format: uuid
          nullable: true
          description: Null for a pass or a ticket.
        membership_period:
          allOf:
            - $ref: "#/components/schemas/MembershipPeriod"
          nullable: true
        fulfilled_at:
          type: string
          format: date-time
        early:
          type: boolean
          description: True when staff delivered before full payment.
        early_reason:
          type: string
          nullable: true
        unpaid_minor:
          type: integer
          description: Balance still due at delivery. Zero for a normal delivery.
        revoked_at:
          type: string
          format: date-time
          nullable: true
        revoke_reason:
          type: string
          nullable: true

    PaymentStatus:
      type: string
      enum: [unpaid, partially_paid, paid, void]

    Sale:
      type: object
      additionalProperties: false
      required:
        - id
        - member
        - location_id
        - channel
        - occurrence
        - booking_id
        - booking_ids
        - attendees
        - currency
        - total_minor
        - paid_minor
        - balance_minor
        - payment_status
        - fulfilled
        - renewal
        - refunded_minor
        - voided_at
        - void_reason
        - refunds
        - purchased_at
        - line_item
        - payments
        - fulfillment
      properties:
        id:
          type: string
          format: uuid
        member:
          $ref: "#/components/schemas/MemberSummary"
        location_id:
          type: string
          format: uuid
          nullable: true
          description: Where a desk sale happened. Null for an online sale.
        channel:
          $ref: "#/components/schemas/SaleChannel"
        occurrence:
          allOf:
            - $ref: "#/components/schemas/SaleOccurrence"
          nullable: true
          description: The time a ticket is for.
        booking_id:
          type: string
          format: uuid
          nullable: true
          description: The first booking a delivered ticket made.
        booking_ids:
          type: array
          description: Every booking a delivered ticket made, one per spot.
          items:
            type: string
            format: uuid
        attendees:
          type: array
          description: Who comes to each spot of a ticket. Empty for other kinds.
          items:
            $ref: "#/components/schemas/SaleAttendee"
        currency:
          type: string
        total_minor:
          type: integer
        paid_minor:
          type: integer
        balance_minor:
          type: integer
        payment_status:
          $ref: "#/components/schemas/PaymentStatus"
        fulfilled:
          type: boolean
        renewal:
          type: boolean
          description: True when the sale renews the member's agreed terms.
        refunded_minor:
          type: integer
          description: Total refunded. `paid_minor` stays the total received.
        voided_at:
          type: string
          format: date-time
          nullable: true
        void_reason:
          type: string
          nullable: true
        refunds:
          type: array
          items:
            $ref: "#/components/schemas/Refund"
        purchased_at:
          type: string
          format: date-time
        line_item:
          $ref: "#/components/schemas/SaleLineItem"
        payments:
          type: array
          description: Oldest first.
          items:
            $ref: "#/components/schemas/Payment"
        fulfillment:
          allOf:
            - $ref: "#/components/schemas/Fulfillment"
          nullable: true

    SaleResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Sale"

    CheckInResult:
      type: string
      enum: [granted, denied]

    DenialReason:
      type: string
      description: |
        - `no_entitlement`: no right is valid at this time.
        - `location_not_allowed`: a right is valid now but not at this location.
        - `usage_limit_reached`: every matching right has no uses left.
      enum: [no_entitlement, location_not_allowed, usage_limit_reached]

    CheckIn:
      type: object
      additionalProperties: false
      required:
        - id
        - member
        - location_id
        - result
        - denial_reason
        - entitlement_id
        - override_reason
        - checked_in_at
      properties:
        id:
          type: string
          format: uuid
        member:
          $ref: "#/components/schemas/MemberSummary"
        location_id:
          type: string
          format: uuid
        result:
          $ref: "#/components/schemas/CheckInResult"
        denial_reason:
          allOf:
            - $ref: "#/components/schemas/DenialReason"
          nullable: true
        entitlement_id:
          type: string
          format: uuid
          nullable: true
          description: The right used by a granted check-in.
        override_reason:
          type: string
          nullable: true
          description: Set when staff let the member in despite `denial_reason`. Nothing was consumed.
        checked_in_at:
          type: string
          format: date-time

    CheckInResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CheckIn"

    BenefitInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        kind:
          $ref: "#/components/schemas/BenefitKind"
        program_ids:
          type: array
          maxItems: 50
          description: Program access only. Selected programs.
          items:
            type: string
            format: uuid
        program_kind:
          allOf:
            - $ref: "#/components/schemas/ProgramKind"
          nullable: true
          description: Program access only. Every program of this kind, when no programs are selected.
        name:
          type: string
          minLength: 1
          maxLength: 200
        usage_limit:
          type: integer
          minimum: 1
          nullable: true
          description: Uses per period. Null or absent means unlimited.
        location_id:
          type: string
          format: uuid
