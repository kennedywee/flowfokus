    StaffOrganizationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/StaffOrganization"

    LocationInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          nullable: true
          maxLength: 300

    LocationResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Location"

    InvitationInput:
      type: object
      additionalProperties: false
      required: [email, role]
