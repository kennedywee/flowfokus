name: Build release candidate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flowfokus
          POSTGRES_PASSWORD: flowfokus
          POSTGRES_DB: flowfokus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flowfokus -d flowfokus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://flowfokus:flowfokus@127.0.0.1:5432/flowfokus_test
      DATABASE_URL: postgres://flowfokus:flowfokus@127.0.0.1:5432/flowfokus_test
      RAILS_ENV: test
      CLOUDFLARE_SEND_METRICS: "false"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Expected vX.Y.Z or vX.Y.Z-rc.N" >&2
            exit 1
          fi
      - uses: jdx/mise-action@v2
        env:
          MISE_DISABLE_TOOLS: ruby
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.5"
          bundler-cache: true
          working-directory: apps/server
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Check compatibility with the last stable contract
        run: |
          stable_tag=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$GITHUB_REF_NAME" | head -n1 || true)
          if [[ -n "$stable_tag" ]]; then
            bash scripts/contract-diff "$stable_tag"
            echo "CONTRACT_BASE=$stable_tag" >> "$GITHUB_ENV"
          fi
      - run: bun run artifacts:check
      - name: Package the server image
        run: |
          mkdir -p release
          docker build -t "flowfokus-server:${GITHUB_SHA}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" apps/server
          bash scripts/check-production-image "flowfokus-server:${GITHUB_SHA}"
          docker save "flowfokus-server:${GITHUB_SHA}" | gzip > release/server-image.tar.gz
          docker image inspect "flowfokus-server:${GITHUB_SHA}" --format '{{json .}}' > release/server-image.json
      - name: Package Worker builds and manifest
        run: |
          tar -czf release/portal.tar.gz -C apps/portal dist
          tar -czf release/site.tar.gz -C apps/site dist
          cp apps/server/openapi.yaml release/openapi.yaml
          node scripts/release-manifest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: flowfokus-candidate-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
