# Public-API deployment candidate. WorkOS integration is required for live staff use.
# Supply a prebuilt image and a managed PostgreSQL URL through the environment.
name: hydraflow-production

services:
  server:
    image: ${HYDRAFLOW_SERVER_IMAGE:?Set the immutable image tag or digest}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${HYDRAFLOW_API_PORT:-3000}:3000"
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "true"
      DATABASE_URL: ${DATABASE_URL:?Set the production PostgreSQL URL}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set a generated Rails secret}
      HYDRAFLOW_DEMO_MODE: "false"
      RAILS_MAX_THREADS: "5"
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/ready')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
