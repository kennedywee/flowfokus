name: hydraflow

services:
  server:
    build:
      context: apps/server
      dockerfile: Dockerfile.dev
    image: hydraflow-server:development
    init: true
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://hydraflow:hydraflow@db:5432/hydraflow_development
      SECRET_KEY_BASE: local-docker-demo-only-not-a-production-secret
      HYDRAFLOW_DEMO_MODE: "true"
      HYDRAFLOW_DEMO_TOKEN: hydraflow-local-demo-token
      RAILS_DEVELOPMENT_HOSTS: server
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      target: development
    image: hydraflow-portal:development
    init: true
    environment:
      API_BASE_URL: http://server:3000
      HYDRAFLOW_DEMO_MODE: "true"
      HYDRAFLOW_DEMO_TOKEN: hydraflow-local-demo-token
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - server

  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
      target: development
    image: hydraflow-site:development
    init: true
    environment:
      API_BASE_URL: http://server:3000
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - server

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: hydraflow
      POSTGRES_PASSWORD: hydraflow
      POSTGRES_DB: hydraflow_development
    ports:
      - "127.0.0.1:${HYDRAFLOW_DB_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydraflow -d hydraflow_development"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
