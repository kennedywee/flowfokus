name: hydraflow

services:
  server-setup:
    image: hydraflow-server:development
    pull_policy: never
    environment: &server-environment
      RAILS_ENV: development
      DATABASE_URL: postgres://hydraflow:hydraflow@db:5432/hydraflow_development
      SECRET_KEY_BASE: local-docker-demo-only-not-a-production-secret
      HYDRAFLOW_DEMO_MODE: "true"
      HYDRAFLOW_DEMO_TOKEN: hydraflow-local-demo-token
      RAILS_DEVELOPMENT_HOSTS: server
    command: ["bash", "-c", "bin/rails db:prepare && bin/rails db:seed"]
    depends_on:
      db:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: infra/Dockerfile.dev-server
    image: hydraflow-server:development
    init: true
    environment: *server-environment
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      server-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/ready')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  portal:
    build:
      context: .
      dockerfile: infra/Dockerfile.dev-web
    image: hydraflow-web:development
    init: true
    environment:
      HYDRAFLOW_WEB_APP: portal
      API_BASE_URL: http://server:3000
      HYDRAFLOW_DEMO_MODE: "true"
      HYDRAFLOW_DEMO_TOKEN: hydraflow-local-demo-token
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      server:
        condition: service_healthy

  site:
    image: hydraflow-web:development
    pull_policy: never
    init: true
    command: ["bun", "run", "--cwd", "apps/site", "dev", "--host", "0.0.0.0"]
    environment:
      HYDRAFLOW_WEB_APP: site
      API_BASE_URL: http://server:3000
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      server:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: hydraflow
      POSTGRES_PASSWORD: hydraflow
      POSTGRES_DB: hydraflow_development
    ports:
      - "127.0.0.1:${HYDRAFLOW_DB_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydraflow -d hydraflow_development"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
